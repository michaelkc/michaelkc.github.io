<footer class="site-footer">
  <div class="site-footer-inner">
    <div>
      <strong>{{ site.title | escape }}</strong>
      <p>{{ site.description | escape }}</p>
    </div>
    <ul class="footer-links">
      {%- if site.email -%}<li><a href="mailto:{{ site.email }}">{{ site.email }}</a></li>{%- endif -%}
      {%- if site.github_username -%}<li><a href="https://github.com/{{ site.github_username }}">GitHub</a></li>{%- endif -%}
      {%- if site.twitter_username -%}<li><a href="https://x.com/{{ site.twitter_username }}">X</a></li>{%- endif -%}
      <li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>
    </ul>
  </div>
</footer>
