<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
  <nav aria-label="Main">
    <ul>
      <li><a href="{{ '/' | relative_url }}"{% if page.layout == 'home' or page.layout == 'post' %} aria-current="page"{% endif %}>Writing</a></li>
      <li><a href="{{ '/tools/' | relative_url }}">Tools</a></li>
      {%- for my_page in site.pages -%}
        {%- if my_page.title and my_page.nav != false -%}
      <li><a href="{{ my_page.url | relative_url }}"{% if page.url == my_page.url %} aria-current="page"{% endif %}>{{ my_page.title | escape }}</a></li>
        {%- endif -%}
      {%- endfor -%}
      <li class="search-container">
        <input type="search" class="search-input small" placeholder="Search posts…" aria-label="Search blog posts" role="searchbox">
        <div class="search-dropdown" role="listbox" aria-label="Search results"></div>
      </li>
    </ul>
  </nav>
</header>
<script src="{{ '/assets/js/search.js' | relative_url }}"></script>
