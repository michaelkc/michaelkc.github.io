<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; img-src data:;">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='#ff9e45'/%3E%3Ctext x='32' y='44' font-family='system-ui,sans-serif' font-size='34' font-weight='700' text-anchor='middle' fill='#1f1003'%3ED%3C/text%3E%3C/svg%3E">
    <title>Clipboard Image to Data URL</title>
    <link rel="stylesheet" href="/kiln/kiln.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>
    <header>
        <a class="brand" href="/">michaelkc.dk</a>
        <nav><ul><li><a href="/tools/">Tools</a></li></ul></nav>
    </header>
    <main class="container">
        <span class="eyebrow">Tool</span>
        <h1>Clipboard image to data URL</h1>
        <p class="lead">Paste an image to convert it to a Base64 data URL, locally in your browser.</p>

        <div class="grid layout-grid">
            <section class="card input-section">
                <h2>Input</h2>
                <label for="input">Paste image here</label>
                <textarea id="input" class="paste-target" rows="6" placeholder="Click here, then press Ctrl+V (⌘V) with an image on your clipboard."></textarea>
            </section>

            <section class="card processing-section">
                <h2>Processing</h2>
                <label for="output-format">Output format
                <select id="output-format">
                    <option value="clanker" selected>Clanker Markdown</option>
                    <option value="raw">Raw data URL</option>
                </select>
                <small>Clanker Markdown wraps the data URL in a fenced block with a preamble, so a coding agent can lift the URL straight out.</small>
                </label>

                <label for="use-upng">Use UPNG
                <select id="use-upng">
                    <option value="no">No</option>
                    <option value="yes" selected>Yes</option>
                </select>
                <small>Re-encodes the PNG with a reduced palette to shrink the output.</small>
                </label>

                <label for="upng-aggressiveness">UPNG aggressiveness
                <select id="upng-aggressiveness">
                    <option value="low">Low (256 colours)</option>
                    <option value="medium">Medium (128 colours)</option>
                    <option value="high" selected>High (64 colours)</option>
                </select>
                </label>
            </section>

            <section class="card output-section">
                <h2>Output</h2>
                <label for="output">Output
                <textarea id="output" class="mono" rows="10" readonly placeholder="The data URL will appear here…"></textarea>
                </label>
                <div class="preview-frame">
                    <img id="output-preview" width="300" height="200" alt="Preview of output image" hidden>
                </div>
                <footer class="actions">
                    <p id="processing-status" class="status" aria-busy="false">Ready</p>
                    <p id="output-length-status" class="status">Output length: 0</p>
                    <button id="copy-output-btn" class="copy-btn" disabled>Copy</button>
                </footer>
            </section>
        </div>
    </main>

    <script src="dist/pako/pako.umd.min.js"></script>
    <script src="dist/upng/UPNG.js"></script>
    <script src="js/clip-to-dataurl.js"></script>
</body>
</html>
