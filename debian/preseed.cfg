### ================================
### Debian 13 (Trixie) Preseed
### Hostname: hermes
### Purpose: Hermes Agent VM on Proxmox
### ================================

### --- Localization ---
d-i debian-installer/language string en
d-i debian-installer/country string DK
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select dk

### --- Network ---
d-i netcfg/choose_interface select auto
d-i netcfg/use_dhcp boolean true
d-i netcfg/get_hostname string hermes
d-i netcfg/get_domain string local

### --- Mirror ---
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### --- Clock ---
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Copenhagen
d-i clock-setup/ntp boolean true

### --- Partitioning ---
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/disk string /dev/sda
d-i partman-auto/confirm boolean true
d-i partman/confirm_write_new_label boolean true
d-i partman/confirm boolean true

### --- Root Account (locked, key-only SSH) ---
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password *
d-i passwd/root-password-again password *

### --- User Account (hermes, locked password, key-only SSH) ---
d-i passwd/user-fullname string hermes
d-i passwd/username string hermes
d-i passwd/user-password-crypted password *
d-i passwd/user-password-again password *

### --- SSH Key Setup ---
d-i openssh-server/permit-root-login boolean true
d-i openssh-server/password-authentication boolean false

d-i preseed/late_command string \
    mkdir -p /target/home/hermes/.ssh ; \
    mkdir -p /target/root/.ssh ; \
    echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA+oMWQtbWGGCNZj0D3zB7XMIwZNOF4Dnm21qUqilxA0 micha@HPVictus" \
    | tee /target/home/hermes/.ssh/authorized_keys > /target/root/.ssh/authorized_keys ; \
    chroot /target chown -R hermes:hermes /home/hermes/.ssh ; \
    chroot /target chmod 600 /home/hermes/.ssh/authorized_keys ; \
    chroot /target chmod 600 /root/.ssh/authorized_keys ; \
    sed -i 's/^#PasswordAuthentication yes/PasswordAuthentication no/' /target/etc/ssh/sshd_config ; \
    sed -i 's/^#PermitRootLogin.*/PermitRootLogin prohibit-password/' /target/etc/ssh/sshd_config ; \
    chroot /target apt-get install -y qemu-guest-agent ; \
    chroot /target systemctl enable qemu-guest-agent ; \
    chroot /target deluser hermes sudo || true ;

### --- Package Selection ---
tasksel tasksel/first multiselect standard, ssh-server

# Required packages for Hermes Agent
d-i pkgsel/include string \
    python3 python3-pip python3-venv \
    nodejs npm \
    git curl wget unzip \
    ffmpeg ripgrep \
    ca-certificates \
    qemu-guest-agent

d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none

### --- Bootloader ---
d-i grub-installer/target string /dev/sda
d-i grub-installer/skip boolean false

### --- Finishing ---
d-i finish-install/reboot_in_progress note
