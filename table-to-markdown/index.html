<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src data:;">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%235b21b6'/%3E%3Ctext x='50' y='70' font-family='sans-serif' font-size='52' font-weight='bold' text-anchor='middle' fill='white'%3ET%3C/text%3E%3C/svg%3E">
    <title>HTML Table to Markdown</title>
    <link rel="stylesheet" href="css/pico.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>
    <main class="container">
        <h1>HTML Table to Markdown</h1>
        <p>Paste an HTML table to convert it to Markdown locally in your browser.</p>

        <div class="layout-grid">
            <section class="input-section">
                <h2>Input</h2>
                <label for="input">HTML table</label>
                <textarea id="input" rows="20" spellcheck="false" placeholder="Paste a &lt;table&gt; here..."></textarea>
                <p id="input-status" role="status" aria-live="polite"></p>
            </section>

            <section class="output-section">
                <h2>Output</h2>
                <label for="output">Markdown table</label>
                <textarea id="output" rows="20" readonly spellcheck="false" placeholder="The Markdown table will appear here..."></textarea>
                <button id="copy-output-btn" class="copy-btn" disabled>Copy</button>
            </section>
        </div>
    </main>

    <script src="js/table-to-markdown.js"></script>
</body>
</html>
