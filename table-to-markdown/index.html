<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; img-src data:;">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='#ff9e45'/%3E%3Ctext x='32' y='44' font-family='system-ui,sans-serif' font-size='34' font-weight='700' text-anchor='middle' fill='#1f1003'%3ET%3C/text%3E%3C/svg%3E">
    <title>HTML Table to Markdown</title>
    <link rel="stylesheet" href="/kiln/kiln.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>
    <header>
        <a class="brand" href="/">michaelkc.dk</a>
        <nav><ul><li><a href="/tools/">Tools</a></li></ul></nav>
    </header>
    <main class="container">
        <span class="eyebrow">Tool</span>
        <h1>HTML table to Markdown</h1>
        <p class="lead">Paste an HTML table to convert it to Markdown, locally in your browser.</p>

        <div class="grid">
            <section class="card input-section">
                <h2>Input</h2>
                <label for="input">HTML table
                <textarea id="input" class="mono" rows="18" spellcheck="false" placeholder="Paste a &lt;table&gt; here…"></textarea>
                </label>
                <p id="input-status" class="status error" role="status" aria-live="polite"></p>
            </section>

            <section class="card output-section">
                <h2>Output</h2>
                <label for="output">Markdown table
                <textarea id="output" class="mono" rows="18" readonly spellcheck="false" placeholder="The Markdown table will appear here…"></textarea>
                </label>
                <footer class="actions">
                    <button id="copy-output-btn" class="copy-btn" disabled>Copy</button>
                </footer>
            </section>
        </div>
    </main>

    <script src="js/table-to-markdown.js"></script>
</body>
</html>
